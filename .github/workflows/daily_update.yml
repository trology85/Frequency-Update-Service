name: Daily Frequency Update

on:
  schedule:
    - cron: '0 3,15 * * *' # Günde 2 kez: Türkiye saatiyle yaklaşık 06:00 ve 18:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turksat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Candidate
        run: python scripts/scraper.py

      - name: Publish Official Türksat Data
        id: publish
        run: |
          python scripts/publish_turksat.py
          cat data/update_result.env
          source data/update_result.env
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "status=$VALIDATION_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload Türksat Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: turksat-frequency-${{ steps.publish.outputs.status }}
          path: |
            data/kanallar_candidate.json
            data/kanallar.json
            data/turksat_42.json
          if-no-files-found: error

      - name: Commit and Push Türksat Data
        run: |
          git config --global user.name "Github Action Bot"
          git config --global user.email "action@github.com"
          git add data/kanallar.json data/kanallar_previous.json data/turksat_42.json
          git diff --cached --quiet || (git commit -m "Türksat frekansları güncellendi: $(date +'%d.%m.%Y %H:%M')" && git push)

  external_satellites:
    needs: turksat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Latest Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest Main
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Sync Published Türksat Satellite File
        run: python scripts/sync_turksat_satellite_file.py

      - name: Update Astra Hot Bird and Hellas
        run: python scripts/update_external_satellites.py

      - name: Validate All Published Satellite Files
        run: python scripts/validate_satellite_files.py

      - name: Upload External Satellite Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-satellite-update-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/external/*

      - name: Commit and Push Approved External Data
        run: |
          git config --global user.name "Satellite Data Bot"
          git config --global user.email "action@github.com"
          git add data/turksat_42.json data/astra_19_2.json data/hotbird_13.json data/hellas_39.json \
            external_pipeline/state reports/external
          for optional_file in \
            data/astra_19_2_previous.json \
            data/hotbird_13_previous.json \
            data/hellas_39_previous.json; do
            if [ -f "$optional_file" ]; then
              git add "$optional_file"
            fi
          done
          git diff --cached --quiet || git commit -m "Uydu verileri güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
